<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack | Add Reminder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="logo">Job<span>Track</span></div>
        <p class="menu-label">MENU</p>

        <nav>
            <a href="/" class="nav-link">▦ Dashboard</a>
            <a href="/applications" class="nav-link">▣ Applications</a>
            <a href="/interviews" class="nav-link">▣ Interviews</a>
            <a href="/reminders" class="nav-link active">◷ Reminders</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="#" class="nav-link">⚙ Settings</a>
            <p>JobTrack v1.0</p>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Add Reminder</h1>
                <p>Never miss an important job application deadline.</p>
            </div>
        </header>

        <section class="applications-section">

            <div class="section-heading">
                <div>
                    <h2>Reminder Details</h2>
                    <p>Enter the information for your reminder.</p>
                </div>
            </div>

            <form action="/add-reminder" method="POST" class="application-form">

                <label>Reminder Title</label>
                <input type="text" name="title"
                       placeholder="Example: Follow up with Burlington"
                       required>

                <label>Reminder Date</label>
                <input type="date" name="reminder_date" required>

                <label>Notes</label>
                <textarea name="notes"
                          placeholder="Add additional details..."></textarea>

                <div class="form-actions">
                    <button type="submit" class="add-button">
                        Save Reminder
                    </button>

                    <a href="/reminders" class="view-button">
                        Cancel
                    </a>
                </div>

            </form>

        </section>

    </main>
</div>

</body>
</html>
